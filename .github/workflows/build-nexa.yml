name: Build Nexa APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Nexa-v3.zip'
      - '.github/workflows/build-nexa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Nexa project
        run: |
          unzip -q Nexa-v3.zip -d extracted
          echo "ZIP contents:"
          find extracted -maxdepth 3 -type f | head -100
          GRADLE_FILE=$(find extracted -name gradlew -type f | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Could not find the Gradle wrapper."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7

**Important:** The workflow assumes the ZIP contains a Gradle wrapper (`gradlew`). It will stop with an error if it doesn't. We must check the build result before treating Nexa as ready to install.

## Step 4: Save the workflow

1. Tap the green **Commit changes…** button at the top right.
2. Leave the default commit message.
3. Confirm **Commit changes**.

## Step 5: Start the build

After saving:

1. Open the **Actions** tab.
2. Select **Build Nexa APK**.
3. Tap **Run workflow**, if it hasn't started automatically.
4. Wait for the job to finish.

